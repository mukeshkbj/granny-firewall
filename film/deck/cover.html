<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
@font-face {
  font-family: 'Space Grotesk';

}
* { margin: 0; padding: 0; box-sizing: border-box; }
body { width: 1920px; height: 1080px; background: #07090C; overflow: hidden; position: relative; font-family: 'Space Grotesk', sans-serif; }

/* faint console motif behind */
.wire { position: absolute; left: 0; right: 0; top: 52%; height: 200px; opacity: .16; }

.center { position: absolute; left: 140px; top: 50%; transform: translateY(-52%); }
.bars { display: flex; gap: 14px; margin-bottom: 54px; }
.bar { width: 52px; height: 6px; }
.g { background: #2EF2A0; } .r { background: #FF5D5D; }
h1 { font-size: 128px; font-weight: 700; color: #E8ECEF; letter-spacing: -3px; line-height: 1; }
.sub { color: #9BA6B0; font-size: 40px; margin-top: 30px; letter-spacing: 1px; }
.meta { margin-top: 70px; font-size: 24px; color: #5A6470; letter-spacing: 3px; }
.meta b { color: #9BA6B0; font-weight: 500; }
</style>
</head>
<body>
<svg class="wire" viewBox="0 0 1920 200" preserveAspectRatio="none">
